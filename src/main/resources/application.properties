spring.application.name=89-cloudwatch-logs
server.port=${PORT\:9696}\n
spring.datasource.url=${RDS_URL\:jdbc\:h2\:mem\:raviteja89;DB_CLOSE_DELAY\=-1;DB_CLOSE_ON_EXIT\=FALSE}
spring.datasource.username=${RDS_USER\:sa}
spring.datasource.password=${RDS_PASSWORD\:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
\u3010entity-aws\u00A6canonical_name\=AWS\u3011.cloudwatch.enabled=${CLOUDWATCH_ENABLED\:false}
\u3010entity-aws\u00A6canonical_name\=AWS\u3011.cloudwatch.logGroup=${CLOUDWATCH_LOG_GROUP\:89-cloudwatch-logs}
\u3010entity-aws\u00A6canonical_name\=AWS\u3011.cloudwatch.logStream=${CLOUDWATCH_LOG_STREAM\:raviteja-89-stream}
aws.region=${AWS_REGION\:ap-south-1}
aws.accessKeyId=${AWS_ACCESS_KEY_ID\:}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY\:}
logging.file.name=logging.file.name\=logs/89-cloudwatch.log
logging.level.com.raviteja.cloudwatch=DEBUG
logging.level.org.hibernate.SQL=DEBUG
app.name=89-cloudwatch-logs
